<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0a1c46"/>
      <stop offset="0.5" stop-color="#0a64d6"/>
      <stop offset="1" stop-color="#16c2c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#7fd3ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7fd3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04163a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(0,-60)" filter="url(#shadow)">
    <!-- curling wave crest: nalu -->
    <path d="M 196 640 C 300 640 352 470 486 420 C 620 370 772 430 790 560 C 804 664 700 712 636 668 C 588 634 600 566 660 560"
          fill="none" stroke="url(#wave)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the commute: a route along the water to a destination -->
    <path d="M 196 800 C 320 770 420 820 540 800 C 640 783 712 772 770 786"
          fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="40" stroke-linecap="round"/>
    <circle cx="806" cy="790" r="46" fill="#30d158" stroke="#ffffff" stroke-width="16"/>
  </g>
</svg>
